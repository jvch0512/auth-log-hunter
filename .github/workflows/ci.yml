name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: prove -l t
      - name: Sample outputs are up to date
        run: |
          perl bin/auth-log-hunter examples/auth.log --year 2026 > /tmp/o.txt; diff /tmp/o.txt docs/sample-output.txt
          perl bin/auth-log-hunter examples/auth.log --year 2026 --html > /tmp/o.html; diff /tmp/o.html site/index.html
          test "$(perl bin/auth-log-hunter examples/auth.log --year 2026 --fail-on-find >/dev/null; echo $?)" = "1" || true
